# ─── Site ─────────────────────────────────────────────────────────────
title: Jiwon Lee
description: >-
  Jiwon Lee is a researcher in computer architecture and systems, with research
  interests including (but not limited to) GPU address translation, virtual
  memory, memory management, multi-GPU systems, and CPU microarchitecture.
  This site contains his biography, publication list, and selected research
  highlights.
url: "https://jiwon24lee.github.io"
baseurl: ""
permalink: pretty
# Used for the "Last updated" date in the footer (= time of the last build/push).
timezone: Europe/Stockholm

author:
  name: Jiwon Lee            # highlighted automatically in author lists
  email: jiwon24.lee@gmail.com

# No preview image when the link is shared.
image: null

# ─── Content ──────────────────────────────────────────────────────────
# Each file in _cv/ is one section of the home page, in filename order.
collections:
  cv:
    output: true
    permalink: /cv/:name/

defaults:
  - scope:
      path: ""
      type: cv
    values:
      layout: page

# ─── Build ────────────────────────────────────────────────────────────
# Only plugins supported by GitHub Pages.
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

sass:
  sass_dir: _sass
  style: compressed

exclude:
  - .editorconfig
  - .jekyll-cache
  - .ruby-version
  - backups
  - unused
  - Gemfile
  - Gemfile.lock
  - LICENSE.md
  - README.md
