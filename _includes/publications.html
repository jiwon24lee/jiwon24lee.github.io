{%- comment -%} Publication list. Data lives in _data/publications.yml. {%- endcomment -%}
<ol class="pub-list">
  {%- for pub in site.data.publications %}
  <li class="pub" itemscope itemtype="https://schema.org/ScholarlyArticle">
    <span class="pub-title" itemprop="name">{{ pub.title }}</span>
    {%- if pub.doi and pub.doi != "" %} <a class="pub-link" href="{{ pub.doi }}" target="_blank" rel="noopener">[DOI]</a>{% endif %}
    <span class="pub-authors">{% include author-list.html names=pub.authors %}</span>
    <span class="pub-venue" itemprop="isPartOf">{{ pub.venue }}</span>
  </li>
  {%- endfor %}
</ol>
